<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>공지사항 편집 — datable</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css">
<style>
  /* 브랜드 SSOT: Figma datable.co.kr 실측 토큰 (site/index.html과 동일) */
  :root{
    --dark:#191919; --bg:#FFFFFF; --card:#F8F9FA;
    --line:#E9ECEF; --line2:#DEE2E6;
    --txt:#212529; --dim:#495057; --faint:#ADB5BD;
    --accent:#0065FF; --accent-soft:rgba(0,101,255,.06);
    --danger:#D64545;
    --en:'Poppins','Spoqa Han Sans Neo',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Spoqa Han Sans Neo',sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}
  .topbar{background:var(--dark)}
  .topbar .in{max-width:820px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:12px}
  .brand{font-family:var(--en);font-weight:700;font-size:18px;color:#fff;text-decoration:none}
  .adm{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:2px;padding:3px 9px}
  .topbar .sp{margin-left:auto}
  .topbar .who{font-size:12.5px;color:var(--faint)}
  .topbar button{background:none;border:1px solid #3a3a3a;color:#ccc;border-radius:2px;
    font-size:12px;padding:6px 12px;cursor:pointer;font-family:inherit}
  .topbar button:hover{border-color:#666;color:#fff}

  header{padding:44px 0 24px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  header h1{font-size:25px;font-weight:700;letter-spacing:-.04em}
  header .sp{margin-left:auto}

  .btn{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:2px;padding:10px 20px;
    cursor:pointer;border:1px solid var(--line2);background:#fff;color:var(--txt);transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#0052D4}
  .btn.sm{font-size:12px;padding:6px 13px}
  .btn.dgr:hover{border-color:var(--danger);color:var(--danger)}
  .btn:disabled{opacity:.5;cursor:default}

  /* 로그인 */
  .login{max-width:380px;margin:80px auto;padding:0 24px}
  .login h2{font-size:21px;font-weight:700;margin-bottom:6px}
  .login p{font-size:13.5px;color:var(--dim);margin-bottom:24px}
  .login input{width:100%;background:#fff;border:1px solid var(--line2);border-radius:2px;
    padding:12px 14px;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none}
  .login input:focus{border-color:var(--accent)}
  .login .btn{width:100%;padding:13px}
  .lmsg{font-size:13px;color:var(--danger);margin-top:12px;min-height:20px}

  /* 목록 */
  table{width:100%;border-collapse:collapse;margin-bottom:56px}
  th{font-size:11.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;
    text-align:left;padding:11px 12px;border-bottom:2px solid var(--txt)}
  td{padding:14px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:hover td{background:var(--card)}
  td.ti{font-weight:500;letter-spacing:-.02em}
  td.ti .badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(0,101,255,.25);border-radius:2px;
    padding:2px 7px;margin-right:8px;vertical-align:1.5px}
  td.dt{font-family:var(--en);font-size:12.5px;color:var(--faint);white-space:nowrap}
  .pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 11px}
  .pill.on{color:#1b8f5a;background:rgba(94,214,164,.15);border:1px solid rgba(94,214,164,.4)}
  .pill.off{color:var(--faint);background:var(--card);border:1px solid var(--line)}
  td.ac{text-align:right;white-space:nowrap}
  td.ac .btn{margin-left:6px}
  .empty{padding:40px 12px;color:var(--faint);font-size:14px;text-align:center}
  @media(max-width:680px){
    th:nth-child(3),td:nth-child(3){display:none}
    td{padding:12px 8px}
  }

  /* 편집 폼 */
  .form{margin-bottom:64px;display:none}
  .fg{margin-bottom:20px}
  .fg label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin-bottom:7px}
  .fg input[type=text],.fg input[type=date],.fg textarea{width:100%;background:#fff;
    border:1px solid var(--line2);border-radius:2px;padding:11px 14px;font-size:14px;
    font-family:inherit;outline:none}
  .fg input:focus,.fg textarea:focus{border-color:var(--accent)}
  .fg textarea{min-height:260px;resize:vertical;line-height:1.8}
  .frow{display:flex;gap:12px;flex-wrap:wrap}
  .frow .fg{flex:1;min-width:160px}
  .fchk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:24px;cursor:pointer}
  .factions{display:flex;gap:10px;align-items:center}
  .fmsg{font-size:13px;color:var(--dim);margin-left:6px}
  .fmsg.ok{color:#1b8f5a}
  .fmsg.err{color:var(--danger)}
</style>
</head>
<body>

<div class="topbar"><div class="in">
  <a class="brand" href="../notice.html">datable</a>
  <span class="adm">공지 편집</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button id="logoutBtn" style="display:none" onclick="doLogout()">로그아웃</button>
</div></div>

<!-- 로그인 -->
<div class="login" id="loginView">
  <h2>공지사항 편집</h2>
  <p>편집 권한 계정으로 로그인해 주세요.</p>
  <input type="email" id="lemail" placeholder="이메일" autocomplete="username">
  <input type="password" id="lpw" placeholder="비밀번호" autocomplete="current-password"
    onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn pri" onclick="doLogin()">로그인</button>
  <div class="lmsg" id="lmsg"></div>
</div>

<!-- 목록 + 편집 -->
<div class="wrap" id="editorView" style="display:none">
  <header>
    <h1>공지사항 관리</h1>
    <span class="sp"></span>
    <button class="btn pri" onclick="newNotice()">+ 새 공지</button>
  </header>

  <div class="form" id="form">
    <div class="frow">
      <div class="fg"><label>제목 *</label><input type="text" id="ftitle" maxlength="120"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>배지 (예: 주주총회 — 비우면 없음)</label><input type="text" id="fbadge" maxlength="12"></div>
      <div class="fg"><label>게시일</label><input type="date" id="fdate"></div>
    </div>
    <div class="fg">
      <label>본문 *</label>
      <textarea id="fbody" placeholder="본문 내용. 줄바꿈은 그대로 반영됩니다."></textarea>
    </div>
    <label class="fchk"><input type="checkbox" id="fpub"> 즉시 게시 (체크 해제 = 비공개 저장)</label>
    <div class="factions">
      <button class="btn pri" id="saveBtn" onclick="saveNotice()">저장</button>
      <button class="btn" onclick="hideForm()">취소</button>
      <span class="fmsg" id="fmsg"></span>
    </div>
  </div>

  <table>
    <thead><tr><th>제목</th><th style="width:110px">게시일</th><th style="width:80px">상태</th><th style="width:150px"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var sb = window.supabase.createClient(
  "https://xenaodixstkagcvlyuri.supabase.co",
  "sb_publishable_lPZNpaQ-wI2vzDVc58QKYw_0Ll_gAM6");
var editingId = null;

function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}

async function refreshUI(){
  var s = (await sb.auth.getSession()).data.session;
  document.getElementById("loginView").style.display = s ? "none" : "";
  document.getElementById("editorView").style.display = s ? "" : "none";
  document.getElementById("logoutBtn").style.display = s ? "" : "none";
  document.getElementById("who").textContent = s ? s.user.email : "";
  if (s) loadList();
}
async function doLogin(){
  var m = document.getElementById("lmsg"); m.textContent = "";
  var r = await sb.auth.signInWithPassword({
    email: document.getElementById("lemail").value.trim(),
    password: document.getElementById("lpw").value});
  if (r.error) { m.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인해 주세요."; return; }
  refreshUI();
}
async function doLogout(){ await sb.auth.signOut(); refreshUI(); }

async function loadList(){
  var r = await sb.from("datable_notices").select("*").order("posted_at", {ascending:false}).order("created_at", {ascending:false});
  var tb = document.getElementById("rows"); tb.innerHTML = "";
  if (r.error) { tb.innerHTML = '<tr><td colspan="4" class="empty">불러오기 실패: ' + esc(r.error.message) + '</td></tr>'; return; }
  if (!r.data.length) { tb.innerHTML = '<tr><td colspan="4" class="empty">등록된 공지가 없습니다. "새 공지"로 시작하세요.</td></tr>'; return; }
  r.data.forEach(function(n){
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="ti">' + (n.badge ? '<span class="badge">' + esc(n.badge) + '</span>' : '') + esc(n.title) + '</td>' +
      '<td class="dt">' + n.posted_at + '</td>' +
      '<td><span class="pill ' + (n.published ? 'on">게시중' : 'off">비공개') + '</span></td>' +
      '<td class="ac"><button class="btn sm" onclick="editNotice(\'' + n.id + '\')">수정</button>' +
      '<button class="btn sm dgr" onclick="delNotice(\'' + n.id + '\')">삭제</button></td>';
    tb.appendChild(tr);
  });
  window._list = r.data;
}
function newNotice(){
  editingId = null;
  document.getElementById("ftitle").value = "";
  document.getElementById("fbadge").value = "";
  document.getElementById("fdate").value = new Date().toISOString().slice(0,10);
  document.getElementById("fbody").value = "";
  document.getElementById("fpub").checked = false;
  showForm();
}
function editNotice(id){
  var n = (window._list||[]).find(function(x){return x.id===id;});
  if (!n) return;
  editingId = id;
  document.getElementById("ftitle").value = n.title;
  document.getElementById("fbadge").value = n.badge || "";
  document.getElementById("fdate").value = n.posted_at;
  document.getElementById("fbody").value = n.body_html;
  document.getElementById("fpub").checked = n.published;
  showForm();
}
function showForm(){ document.getElementById("form").style.display="block"; document.getElementById("fmsg").textContent=""; window.scrollTo(0,0); }
function hideForm(){ document.getElementById("form").style.display="none"; editingId=null; }

async function saveNotice(){
  var msg = document.getElementById("fmsg"); msg.className = "fmsg";
  var title = document.getElementById("ftitle").value.trim();
  var body = document.getElementById("fbody").value.trim();
  if (!title || !body) { msg.classList.add("err"); msg.textContent = "제목과 본문은 필수입니다."; return; }
  var row = {
    title: title,
    badge: document.getElementById("fbadge").value.trim(),
    body_html: body,
    posted_at: document.getElementById("fdate").value || new Date().toISOString().slice(0,10),
    published: document.getElementById("fpub").checked,
    updated_at: new Date().toISOString()
  };
  document.getElementById("saveBtn").disabled = true;
  var r = editingId
    ? await sb.from("datable_notices").update(row).eq("id", editingId)
    : await sb.from("datable_notices").insert(row);
  document.getElementById("saveBtn").disabled = false;
  if (r.error) { msg.classList.add("err"); msg.textContent = "저장 실패: " + r.error.message; return; }
  msg.classList.add("ok"); msg.textContent = "저장되었습니다.";
  hideForm(); loadList();
}
async function delNotice(id){
  if (!confirm("이 공지를 삭제할까요? 되돌릴 수 없습니다.")) return;
  var r = await sb.from("datable_notices").delete().eq("id", id);
  if (r.error) { alert("삭제 실패: " + r.error.message); return; }
  loadList();
}
refreshUI();
</script>
</body>
</html>
